name: Build Mod Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -print -quit)
          if [ -n "$BUILD_FILE" ]; then
            DIR=$(dirname "$BUILD_FILE")
            echo "build.gradle şu dizinde bulundu: $DIR"
            cd "$DIR"
            gradle build --stacktrace
          else
            echo "HATA: Depoda hiç build.gradle dosyası yok!"
            exit 1
          fi

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomBiomes-Mod-JAR
          path: "**/build/libs/*.jar"
